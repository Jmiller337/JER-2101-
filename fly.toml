# Fly.io configuration. See docs/SETUP.md, "Option B: Fly.io".
# Before the first deploy, change `app` to a name of your own (it becomes <name>.fly.dev)
# and `primary_region` to the region nearest the user (`fly platform regions` lists them).

app = "document-reader-change-me"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine always stays running, so the app never has to start up (several seconds) on the
  # first visit after a pause. A small machine costs a few dollars a month; to save it, set
  # min_machines_running = 0 and the machine stops when nobody is using the app.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
